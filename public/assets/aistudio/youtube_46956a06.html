<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>youtube</title>
   <style>
      body {
         margin: 0;
         font-family: Arial, sans-serif;
      }


   
      .header {
         display: flex;
         justify-content: space-between;
         /* 3 хайрцаг: зүүн, голд, баруун */
         align-items: center;
         padding: 10px 20px;
      }

      .logo {
         display: flex;
         align-items: center;
         gap: 20px;
      }

      .logo-img {
         width: 90px;
      }

      .icon {
         width: 24px;
      }

      .search {
         display: flex;
      }

      .search input {
         width: 400px;
         padding: 10px 15px;
         border: 1px solid #ccc;
         border-radius: 20px 0 0 20px;
      }

      .search button {
         padding: 6px 20px;
         border: 1px solid #ccc;
         border-radius: 0 20px 20px 0;
      }

      .icons {
         display: flex;
         align-items: center;
         gap: 20px;
      }

      .profile {
         width: 32px;
         height: 32px;
         border-radius: 50%;
         /* дугуй — өөрийн зураг */
      }

      .sidebar {
         display: flex;
         flex-direction: column;
         gap: 5px;
         padding: 10px;
      }

      .sidebar a {
         display: flex;
         align-items: center;
         gap: 20px;
         padding: 10px;
         border-radius: 10px;
         color: black;
         text-decoration: none;
      }

      .sidebar a:hover {
         background: #f2f2f2;
      }

      .main {
         padding: 10px 20px;
         display: flex;
         flex:1;
         align-items: flex-start;
         flex-direction: column;
       }

      .chips {
         display: flex;
         height: auto;
         flex-wrap: wrap;
         gap: 10px;
         margin-bottom: 20px;
      }

      .chips span {
         background: #f2f2f2;
         padding: 8PX 12PX;
         border-radius: 8px;

      }

      .chips span:hover {
         background: #e5e5e5;
      }

      .chips .on {
         background: black;
         color: white;
      }
      .page{
         display: flex;
       
         
      }
      .videos{
      }
   </style>


</head>

<body>
   <div class="header">
      <div class="logo">
         <img class="icon"
            src="https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/menu/default/24px.svg" />
         <img class="logo-img" src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" />
      </div>
      <div class="search">
         <input placeholder="Хайх" />
         <button>
            <img class="icon"
               src="https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/search/default/24px.svg" />
         </button>
      </div>
      <div class="icons">
         <img class="icon"
            src="https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/video_call/default/24px.svg" />
         <img class="icon"
            src="https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/notifications/default/24px.svg" />
         <img class="profile" src="https://b.fssta.com/uploads/application/soccer/headshots/70204.png" />
      </div>
   </div>

   <div class="page">
      <div class="sidebar">
         <a href="index.html">
            <img class="icon"
               src="https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/home/default/24px.svg" />
            Нүүр
         </a>
         <a href="minii-mergjil.html">
            <img class="icon"
               src="https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/bolt/default/24px.svg" />
            Shorts
         </a>
         <a href="#">
            <img class="icon"
               src="https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/subscriptions/default/24px.svg" />
            Subscriptions
         </a>
      </div>
      <div class="main">
         <div class="chips">
            <span class="on">Бүгд</span>
            <span>Хөгжим</span>
            <span>Тоглоом</span>
            <span>Live</span>
            <span>Аниме</span>
         </div>

         <div class="videos">
            <iframe width="250" height="150" src="https://www.youtube.com/embed/6wRrHtapCEE?si=rrKfF0dC4AA8Sr-E" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <iframe width="250" height="150" src="https://www.youtube.com/embed/r7qovpFAGrQ?si=n1U0HOyU0r57pdis" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <iframe width="250" height="150" src="https://www.youtube.com/embed/V9rh9f1G5c8?si=YvDI3PtguWPbqEzK" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <iframe width="250" height="150" src="https://www.youtube.com/embed/ApXoWvfEYVU?si=yPmL8QxhE-4kXv7R" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <iframe width="250" height="150" src="https://www.youtube.com/embed/kTJczUoc26U?si=usqDVC6Yxny8_dpZ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
         </div>
      </div>
   </div>

</body>

</html>
